services:
  tradelab:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Set TRADELAB_MONGO_URL in .env to use another MongoDB (e.g. Atlas); otherwise the one below.
      TRADELAB_MONGO_URL: ${TRADELAB_MONGO_URL:-mongodb://mongo:27017/?replicaSet=rs0}
    volumes:
      - tradelab-data:/data          # encryption key, stock list cache, logs — back this up
    expose:
      - "8000"                       # only reachable through Caddy below
    depends_on:
      mongo:
        condition: service_healthy

  mongo:                             # the database (records: accounts, lists, orders, reports)
    image: mongo:8.0
    restart: unless-stopped
    # A replica set of one server, so every save is all-or-nothing (MongoDB transactions).
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db          # back this up too (see README)
    expose:
      - "27017"                      # reachable only by the containers above, never from the internet
    healthcheck:                     # also sets up the replica set the first time
      test: ["CMD", "mongosh", "--quiet", "--eval",
             "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 10s
      start_period: 20s
      retries: 30

  caddy:                             # automatic HTTPS (required to install the app on Android/Windows)
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - tradelab

volumes:
  tradelab-data:
  mongo-data:
  caddy-data:
  caddy-config:
